apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-script
  namespace: default
data:
  app.py: |
    from flask import Flask, request, jsonify
    import time, random
    from prometheus_client import Counter, Histogram, Gauge, generate_latest, CONTENT_TYPE_LATEST

    app = Flask(__name__)

    http_requests_total = Counter('http_requests_total', 'Total HTTP requests',
        ['service', 'method', 'endpoint', 'status'])
    http_request_duration_seconds = Histogram('http_request_duration_seconds', 'HTTP request latency',
        ['service', 'method', 'endpoint'])
    app_queue_depth = Gauge('app_queue_depth', 'Current queue depth', ['queue'])
    app_active_connections = Gauge('app_active_connections', 'Active connections', ['service'])

    simulated_queue = []
    active_connections_count = 0

    @app.before_request
    def before_request():
        global active_connections_count
        active_connections_count += 1
        app_active_connections.labels(service='api').set(active_connections_count)
        request.start_time = time.time()

    @app.after_request
    def after_request(response):
        global active_connections_count
        active_connections_count = max(0, active_connections_count - 1)
        app_active_connections.labels(service='api').set(active_connections_count)
        if hasattr(request, 'start_time'):
            duration = time.time() - request.start_time
            http_request_duration_seconds.labels(
                service='api', method=request.method,
                endpoint=request.endpoint or 'unknown').observe(duration)
        http_requests_total.labels(
            service='api', method=request.method,
            endpoint=request.endpoint or 'unknown',
            status=str(response.status_code)).inc()
        return response

    @app.route('/health')
    def health():
        return jsonify({'status': 'healthy', 'timestamp': time.time()})

    @app.route('/api/process', methods=['POST'])
    def process_task():
        global simulated_queue
        data = request.get_json() or {}
        complexity = data.get('complexity', 'normal')
        simulated_queue.append({'task_id': random.randint(1000, 9999)})
        app_queue_depth.labels(queue='default').set(len(simulated_queue))
        time.sleep(random.uniform(0.05, 0.15) if complexity == 'normal' else
                   random.uniform(0.1, 0.3) if complexity == 'complex' else
                   random.uniform(0.01, 0.05))
        if simulated_queue:
            simulated_queue.pop(0)
            app_queue_depth.labels(queue='default').set(len(simulated_queue))
        return jsonify({'status': 'processed', 'queue_depth': len(simulated_queue)})

    @app.route('/api/data')
    def get_data():
        time.sleep(random.uniform(0.001, 0.01))
        return jsonify({'data': [{'id': i, 'value': random.randint(1, 100)} for i in range(10)]})

    @app.route('/api/heavy')
    def heavy_computation():
        duration = random.uniform(0.2, 0.5)
        time.sleep(duration)
        if random.random() < 0.05:
            return jsonify({'error': 'Processing failed'}), 500
        return jsonify({'status': 'completed', 'computation_time': duration})

    @app.route('/api/queue/add', methods=['POST'])
    def add_to_queue():
        global simulated_queue
        count = (request.get_json() or {}).get('count', 1)
        for _ in range(count):
            simulated_queue.append({'task_id': random.randint(1000, 9999)})
        app_queue_depth.labels(queue='default').set(len(simulated_queue))
        return jsonify({'status': 'added', 'queue_depth': len(simulated_queue)})

    @app.route('/api/queue/clear', methods=['POST'])
    def clear_queue():
        global simulated_queue
        simulated_queue = []
        app_queue_depth.labels(queue='default').set(0)
        return jsonify({'status': 'cleared'})

    @app.route('/metrics')
    def metrics():
        return generate_latest(), 200, {'Content-Type': CONTENT_TYPE_LATEST}

    @app.route('/')
    def index():
        return jsonify({'service': 'demo-app', 'version': '1.0.0'})

    if __name__ == '__main__':
        app_queue_depth.labels(queue='default').set(0)
        app_active_connections.labels(service='api').set(0)
        app.run(host='0.0.0.0', port=5000, debug=False)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: default
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: demo-app
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install flask==3.0.0 prometheus-client==0.19.0 --quiet
              python /app/app.py
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: app-script
              mountPath: /app
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: app-script
          configMap:
            name: demo-app-script
