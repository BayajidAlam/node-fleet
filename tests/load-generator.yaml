apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: default
spec:
  replicas: 10
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: stress
          image: polinux/stress:1.0.4
          command: ["stress"]
          args: ["--cpu", "1", "--timeout", "600s"]
          resources:
            requests:
              cpu: "1000m"
              memory: "100Mi"
            limits:
              cpu: "1000m"
              memory: "200Mi"
