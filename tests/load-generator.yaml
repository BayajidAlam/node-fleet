apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: default
spec:
  replicas: 8
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      tolerations:
      - operator: Exists
      containers:
      - name: stress
        image: polinux/stress:1.0.4
        command: ["stress"]
        args: ["--cpu", "4", "--vm", "1", "--vm-bytes", "200M", "--timeout", "600s"]
        resources:
          requests:
            cpu: "800m"
            memory: "200Mi"
