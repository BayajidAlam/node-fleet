# Prometheus Recording Rules
# Alerting handled by AWS CloudWatch Alarms (pulumi/src/cloudwatch-alarms.ts)
# Recording rules pre-aggregate expensive queries so Grafana panels stay fast

groups:
  - name: node-fleet-cost
    interval: 30s
    rules:
      - record: cost:hourly_total
        expr: sum(aws_ec2_instance_cost_per_hour{cluster="node-fleet"})

      - record: cost:daily_projection
        expr: sum(aws_ec2_instance_cost_per_hour{cluster="node-fleet"}) * 24

      - record: cost:monthly_projection
        expr: sum(aws_ec2_instance_cost_per_hour{cluster="node-fleet"}) * 730

      - record: cost:savings_vs_always_on_pct
        expr: (1 - (sum(aws_ec2_instance_cost_per_hour{cluster="node-fleet"}) / (0.0464 * 10))) * 100

      - record: cost:spot_savings_pct
        expr: aws_spot_savings_percentage{cluster="node-fleet"}

      - record: cost:spot_hourly
        expr: sum(aws_ec2_instance_cost_per_hour{cluster="node-fleet", lifecycle="spot"})

      - record: cost:ondemand_hourly
        expr: sum(aws_ec2_instance_cost_per_hour{cluster="node-fleet", lifecycle="on-demand"})

  - name: node-fleet-cluster
    interval: 30s
    rules:
      - record: cluster:node_count
        expr: count(kube_node_info)

      - record: cluster:cpu_utilization
        expr: avg(rate(node_cpu_seconds_total{mode!="idle"}[5m])) * 100

      - record: cluster:memory_utilization
        expr: (1 - avg(node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100

      - record: cluster:pending_pods
        expr: sum(kube_pod_status_phase{phase="Pending"})
